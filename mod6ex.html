<!DOCTYPE html>

<body>

    <h2 id="Header">This is a test.</h2>
    <button onclick="changeHeader()">Change header</button>
    <p id="demo">Boop</p>

    <div id="output">What is your name?</div>
    <input type="text" id="inputfield" placeholder="Name">
    <button onclick="updateText()">Enter</button>
    
    <script>
        function updateText() {
            const newText = document.getElementById('inputfield').value ;
            let result = "<h1> Your name is " + newText + "</h1>";
            document.getElementById("output").innerHTML = result;
        }
    </script>

    <script>
        function changeHeader() {
let myheader = document.getElementById("Header")

            myheader.innerHTML = "New Header"; //Using let allows for shorthands
            document.getElementById("Header").style.color = "green"; //The long way
        }
    </script>
